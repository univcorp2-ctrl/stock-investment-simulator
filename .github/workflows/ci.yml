name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-build-and-excel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build and generate Excel research workbook
        run: npm run build
      - name: Upload research workbook artifact
        uses: actions/upload-artifact@v4
        with:
          name: investing-api-research-workbook
          path: |
            dist/research/investing_api_research.xlsx
            dist/research/*.csv
          if-no-files-found: error
